[project]
name = "thehub-nordic-scraper"
version = "1.0.0"
description = "Scrape Nordic IT & Software companies not seeking funding from thehub.io"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "rich>=13.7",
    "selectolax>=0.3.21",
    "polars>=1.0",
    "xlsxwriter>=3.2",
    "mcp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest", "anyio", "mcp[cli]>=2.3"]  # mcp[cli] adds `mcp dev`, the Inspector

[project.scripts]
thehub = "thehub_scraper.cli:main"
thehub-mcp = "thehub_scraper.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thehub_scraper"]
